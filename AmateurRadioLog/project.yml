name: AmateurRadioLog
options:
  bundleIdPrefix: com.w2asm
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  CATBridgeKit:
    url: git@github.com:morria/pocket-cat.git
    # 3.0.0 is required, not just preferred: before it, a bridge iOS had
    # already bonded could never be discovered (the firmware stops
    # advertising while connected), so reconnecting appeared to need
    # "Forget This Bridge". It also makes DiscoveredBridge.rssi optional.
    from: 3.1.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO

targets:
  AmateurRadioLog:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - AmateurRadioLog
    dependencies:
      - package: CATBridgeKit
        product: CATBridgeKit
    settings:
      base:
        DEVELOPMENT_TEAM: 7Q2SS8772K
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.AmateurRadioLog
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_EMIT_LOC_STRINGS: YES
        PRODUCT_NAME: "QSO"
        PRODUCT_MODULE_NAME: AmateurRadioLog
        CODE_SIGN_ENTITLEMENTS: AmateurRadioLog/App/AmateurRadioLog.entitlements
        SWIFT_STRICT_CONCURRENCY: targeted
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: QSO
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        UILaunchScreen: {}
        # iOS terminates the app on first CBCentralManager use without this.
        NSBluetoothAlwaysUsageDescription: "QSO connects to your transceiver's CAT interface over a Pocket Cat Bluetooth bridge."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Self-hosted Wavelog instances are routinely plain HTTP on a private
        # network. This permits cleartext only to .local and unqualified
        # hostnames — far narrower than NSAllowsArbitraryLoads, which would
        # weaken every other request the app makes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # ADIF is not a system type and is not ours to define, so it is
        # *imported*: we describe a format other logging software already
        # produces. Declaring it is what puts QSO in other apps' share
        # sheets and "Open With" menus — and what makes
        # UTType("com.amateurradiolog.adif") resolve at all.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.amateurradiolog.adif
            UTTypeDescription: ADIF Log
            UTTypeConformsTo:
              - public.plain-text
              - public.data
            UTTypeTagSpecification:
              public.filename-extension: [adi, adif]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ADIF Log
            LSItemContentTypes: [com.amateurradiolog.adif]
            # Editor, not Viewer: an imported log is merged into this app's
            # own log, not merely displayed. Alternate rank because ADIF
            # belongs to the hobby — other logging software has an equal
            # claim on the extension.
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
        # Open a log from Files or iCloud without copying it in first.
        LSSupportsOpeningDocumentsInPlace: true

    entitlements:
      path: AmateurRadioLog/App/AmateurRadioLog.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        # Incoming UDP from WSJT-X (and future multi-op Field Day peers)
        com.apple.security.network.server: true
        # Sandboxed macOS build: CoreBluetooth is blocked without this.
        com.apple.security.device.bluetooth: true
        com.apple.security.personal-information.location: true
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.com.amateurradiolog.app"
        com.apple.developer.icloud-services:
          - "CloudDocuments"
          - "CloudKit"
        com.apple.developer.ubiquity-container-identifiers:
          - "iCloud.com.amateurradiolog.app"

  AmateurRadioLogTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AmateurRadioLogTests
    dependencies:
      - target: AmateurRadioLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.AmateurRadioLogTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QSO.app/Contents/MacOS/QSO"
        BUNDLE_LOADER: "$(TEST_HOST)"

  AmateurRadioLogUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - AmateurRadioLogUITests
    dependencies:
      - target: AmateurRadioLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.AmateurRadioLogUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AmateurRadioLog
        DEVELOPMENT_TEAM: 7Q2SS8772K

schemes:
  AmateurRadioLog:
    build:
      targets:
        AmateurRadioLog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmateurRadioLogTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # iOS-only UI tests: the unit-test bundle is macOS-only, so these get
  # their own scheme rather than sharing the main scheme's test action.
  AmateurRadioLogUITests:
    build:
      targets:
        AmateurRadioLogUITests: test
    test:
      config: Debug
      targets:
        - AmateurRadioLogUITests
