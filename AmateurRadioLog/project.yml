name: AmateurRadioLog
options:
  bundleIdPrefix: com.w2asm
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO

targets:
  AmateurRadioLog:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - AmateurRadioLog
    settings:
      base:
        DEVELOPMENT_TEAM: 7Q2SS8772K
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.AmateurRadioLog
        INFOPLIST_KEY_CFBundleDisplayName: "Amateur Radio Log"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_EMIT_LOC_STRINGS: YES
        PRODUCT_NAME: "Amateur Radio Log"
        PRODUCT_MODULE_NAME: AmateurRadioLog
        CODE_SIGN_ENTITLEMENTS: AmateurRadioLog/App/AmateurRadioLog.entitlements
        SWIFT_STRICT_CONCURRENCY: targeted
    entitlements:
      path: AmateurRadioLog/App/AmateurRadioLog.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        # Incoming UDP from WSJT-X (and future multi-op Field Day peers)
        com.apple.security.network.server: true
        com.apple.security.personal-information.location: true
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.com.amateurradiolog.app"
        com.apple.developer.icloud-services:
          - "CloudDocuments"
          - "CloudKit"
        com.apple.developer.ubiquity-container-identifiers:
          - "iCloud.com.amateurradiolog.app"

  AmateurRadioLogTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AmateurRadioLogTests
    dependencies:
      - target: AmateurRadioLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.AmateurRadioLogTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amateur Radio Log.app/Contents/MacOS/Amateur Radio Log"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AmateurRadioLog:
    build:
      targets:
        AmateurRadioLog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmateurRadioLogTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
